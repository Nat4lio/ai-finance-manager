spring:
  application:
    name: ai-finance-manager-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aifinance}
    username: ${DB_USERNAME:aifinance}
    password: ${DB_PASSWORD:localdevpassword}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    time-zone: UTC
app:
  demo:
    enabled: ${DEMO_MODE:false}
  security:
    jwt:
      secret-base64: ${JWT_SECRET_BASE64}
      issuer: ai-finance-manager
      expiration: PT15M
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
