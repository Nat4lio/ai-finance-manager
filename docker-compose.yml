services:
  postgres:
    image: postgres:17-alpine
    container_name: ai-finance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aifinance
      POSTGRES_USER: aifinance
      POSTGRES_PASSWORD: localdevpassword
    ports:
      - "5432:5432"
    volumes:
      - aifinance_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aifinance -d aifinance"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aifinance_pgdata:
